services:

  caddy:
    build:
      # need to include files from parent dir (see Dockerfile)
      context: ../
      dockerfile: docker/caddy/Dockerfile
    restart: unless-stopped
    depends_on:
      - prayer
    security_opt:
      - no-new-privileges:true
    # Persist certs across container rebuilds to avoid
    # hitting the Let's Encrypt rate limit on redeployment.
    volumes:
      - caddy_data:/root/.local/share/caddy
    ports:
      - "443:443"
      - "80:80"

  prayer:
    build:
      # need to include files from parent dir (see Dockerfile)
      context: ../
      dockerfile: docker/prayer-app/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${PRAYER_APP_FILES_DIR}:/etc/prayer-app/files:ro
    # NOTE: no ports are published on purpose; Caddy (TLS + rate limiting) is
    # the only public entrypoint and reaches the backend via the internal
    # Docker network on prayer:3457.

volumes:
  caddy_data:
